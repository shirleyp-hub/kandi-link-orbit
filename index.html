<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KANDI LINK ORBIT simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div id="world" class="world" aria-label="Festival scene"></div>
  <div class="vignette" aria-hidden="true"></div>

  <header class="top">
    <div class="logo">KANDI<span> LINK</span></div>
    <div class="modes" role="tablist" aria-label="Mode">
      <button type="button" role="tab" id="modeStory" class="on" aria-selected="true">Story</button>
      <button type="button" role="tab" id="modeFree" aria-selected="false">Free roam</button>
    </div>
  </header>

  <aside class="story" id="story">
    <ol class="steps" id="steps"></ol>
    <div class="caption">
      <div class="cap-k" id="capK"></div>
      <h1 id="capT"></h1>
      <p id="capB"></p>
    </div>
    <div class="controls">
      <button type="button" id="prev" aria-label="Previous step">Back</button>
      <button type="button" id="play" class="primary">Pause</button>
      <button type="button" id="next" aria-label="Next step">Next</button>
    </div>
  </aside>

  <aside class="free" id="free" hidden>
    <div class="cap-k">Free roam</div>
    <p>WASD or arrow keys to walk and turn. Q and E twist the ring. Pick anyone below and find them yourself.</p>
  </aside>

  <div class="status" id="status">
    <div class="stat dead"><span class="k">Phone</span><span class="v">0%</span></div>
    <div class="stat dead"><span class="k">Signal</span><span class="v">None</span></div>
    <div class="stat"><span class="k">Band</span><span class="v" id="bandBat">86%</span></div>
    <div class="stat hi"><span class="k">To friend</span><span class="v" id="dist">· · ·</span></div>
  </div>

  <div class="crew" id="crew" aria-label="Pick a friend"></div>

  <div class="mini"><canvas id="mini" width="440" height="440" aria-label="Map of the festival"></canvas></div>

  <section class="wrist" id="wrist" aria-label="Your band">
    <div class="wrist-view" id="wristView"></div>
    <div class="facing" aria-hidden="true">YOU FACE ▲</div>
    <div class="wrist-bar">
      <span id="wristMode">Idle</span>
      <button type="button" id="explode">Inside the band</button>
    </div>
    <div class="info" id="info" hidden></div>
  </section>

  <div class="buzz" id="buzz" aria-live="polite"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
